<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportsHub — Eventi sportivi</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="fw-bold">SportsHub</h1>
        <p>Cerca una squadra, scopri prossime partite e utili risultati.</p>
        <div class="d-flex">
          <input placeholder="inserisci il nome della squadra" class="p-3 w-100"  type="text" name="" id="searchTeam">
          <button id="startSearch" class="btn btn-light fw-bold">Cerca</button>
        </div>
      </div>
      <!-- Titolo dell'app + form di ricerca -->
    </header>

    <main class="container">
      <section id="favorites-section">
        <h2>Preferiti</h2>
        <div id="preferitiSection"class="row d-flex justify-content-center"></div>
      </section>


      <section >
        <!-- Spinner, errore, lista risultati ricerca squadre -->
        <h2>risultato</h2>
         <div id="risultati-section" class="row d-flex justify-content-center">
         </div>
      </section>

      <section id="dettagli-section" hidden>
        <!-- Visibile dopo click su una squadra: prossimi eventi + ultimi risultati -->
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>

    <script type="module" src="assets/js/script.js"></script>
  </body>
</html>
